<title>Quality of living</title><style>
:root{--surface:#fcfcfb;--panel:#fff;--ink:#0b0b0b;--ink2:#52514e;--ink3:#8a8a85;--line:#e3e3df;--accent:#256abf}
@media (prefers-color-scheme:dark){:root{--surface:#1a1a19;--panel:#232322;--ink:#fff;--ink2:#c3c2b7;--ink3:#8a8a85;--line:#3a3a38;--accent:#3987e5}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--surface);color:var(--ink);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 28px;max-width:430px;width:calc(100% - 40px)}
h1{font-size:17px;font-weight:640;margin:0 0 4px}
p{color:var(--ink2);font-size:13px;margin:0 0 16px}
code{background:rgba(128,128,128,.14);border-radius:3px;padding:1px 4px;font-size:12px}
form{display:flex;gap:8px}
input{flex:1;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink)}
button{font:inherit;font-size:14px;padding:9px 16px;border:0;border-radius:7px;background:var(--accent);color:#fff;cursor:pointer;font-weight:560}
button:disabled{opacity:.55;cursor:default}
.msg{font-size:12.5px;color:var(--ink3);margin-top:11px;min-height:1.4em}
.msg.bad{color:#e8590c}
</style></head><body>
<div class="box">

  <p>This page is encrypted. Enter the passphrase to read it &mdash; it will be remembered on this device. To be asked again, add <code>?forget</code> to the address.</p>
  <form id="f"><input id="p" type="password" autocomplete="current-password" placeholder="Passphrase" autofocus><button id="b">Open</button></form>
  <div class="msg" id="m"></div>
</div>

function bytes(b64){const s=atob(b64),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
const m=document.getElementById("m"),b=document.getElementById("b");
const KEYNAME="ql-pass";
async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:SALT,iterations:ITER,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:IV},key,bytes(B64));
  const html=new TextDecoder().decode(plain);
  try{localStorage.setItem(KEYNAME,pw)}catch(e){}
  document.open(); document.write(html); document.close();
}
// Remembered in localStorage rather than sessionStorage: sessionStorage is per-TAB, so any
// link opening in a new tab asked for the passphrase all over again. The trade is that it
// now persists in the browser profile until cleared — acceptable for a page shared between
// two people on their own machines.
//
// Adding ?forget to the address clears it and asks again. A link injected into the decrypted
// page would be neater, but splicing HTML with nested quotes into a document.write inside an
// encrypted payload broke the write outright; a query parameter has no escaping to get wrong.
if(location.search.indexOf("forget")>=0){ try{localStorage.removeItem(KEYNAME)}catch(e){} }
(async()=>{ let saved=null; try{saved=localStorage.getItem(KEYNAME)}catch(e){}
  if(saved){ m.textContent="Opening…"; try{ await open_(saved) }catch(e){
    try{localStorage.removeItem(KEYNAME)}catch(_){} m.textContent=""; } } })();
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const pw=document.getElementById("p").value; if(!pw) return;
  b.disabled=true; m.className="msg"; m.textContent="Decrypting\u2026";
  try{
    // document.write rather than a blob URL: it keeps the page's own address, so the
    // relative links between these pages still resolve.
    await open_(pw);
  }catch(err){
    b.disabled=false; m.className="msg bad"; m.textContent="That passphrase did not work.";
