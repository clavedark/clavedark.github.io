<title>Quality of living</title><style>
:root{--surface:#fcfcfb;--panel:#fff;--ink:#0b0b0b;--ink2:#52514e;--ink3:#8a8a85;--line:#e3e3df;--accent:#256abf}

*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--surface);color:var(--ink);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:26px 28px;max-width:430px;width:calc(100% - 40px)}
h1{font-size:17px;font-weight:640;margin:0 0 4px}
p{color:var(--ink2);font-size:13px;margin:0 0 16px}
form{display:flex;gap:8px}
input{flex:1;font:inherit;font-size:14px;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink)}
button{font:inherit;font-size:14px;padding:9px 16px;border:0;border-radius:7px;background:var(--accent);color:#fff;cursor:pointer;font-weight:560}
button:disabled{opacity:.55;cursor:default}
.msg{font-size:12.5px;color:var(--ink3);margin-top:11px;min-height:1.4em}
.msg.bad{color:#e8590c}
</style></head><body>

function bytes(b64){const s=atob(b64),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
const m=document.getElementById("m"),b=document.getElementById("b");
const KEYNAME="ql-pass";
async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:SALT,iterations:ITER,hash:"SHA-256"},

  const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv:IV},key,bytes(B64));
  const html=new TextDecoder().decode(plain);
  try{sessionStorage.setItem(KEYNAME,pw)}catch(e){}
  document.open(); document.write(html); document.close();
}
// If the passphrase already worked this session, open without asking again. It is held in
// sessionStorage, so it dies with the tab and never touches disk or the network.
(async()=>{ let saved=null; try{saved=sessionStorage.getItem(KEYNAME)}catch(e){}

document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();
  const pw=document.getElementById("p").value; if(!pw) return;
  b.disabled=true; m.className="msg"; m.textContent="Decrypting\u2026";
  try{
